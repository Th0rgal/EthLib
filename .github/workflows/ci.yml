# Build the specs and their proofs.
#
# The Python test-vector suites are too slow to run on every change, so
# they stay a local step for now.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a pull request supersedes the run still in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Installs elan, fetches the mathlib cache, then builds both libraries.
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          # An unfinished proof only warns, so warnings have to be fatal.
          build-args: "--wfail"

          # Caching `.lake` is pointless: mathlib alone exceeds the 10 GB limit.
          use-github-cache: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build and test CPython bindings
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --no-build-isolation ".[test]"
          python -c "import ethlib.cryptography._native as n; assert n.BYTES_PER_PUBKEY == 48 and n.BYTES_PER_COMMITMENT == 48"
          python -m pytest
